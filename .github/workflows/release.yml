name: release

# Builds CLIProxyAPI plugin-store assets for a v<version> tag:
# <id>_<version>_<goos>_<goarch>.zip (library at the zip root) and checksums.txt.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  PLUGIN_ID: team-routing

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Regression and dashboard checks
        run: |
          go test -tags abiprobe -count=1 ./...
          node --check dashboard.js
          node --check editors.js
          node --test dashboard_session_test.js

  windows-linux:
    needs: validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - name: Build
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          # glibc 2.17 keeps the .so loadable on older distributions and Docker images.
          for spec in windows/amd64/x86_64-windows-gnu/dll linux/amd64/x86_64-linux-gnu.2.17/so linux/arm64/aarch64-linux-gnu.2.17/so; do
            IFS=/ read -r goos goarch zigtarget ext <<<"$spec"
            stage="stage/$goos-$goarch"
            mkdir -p "$stage"
            CGO_ENABLED=1 GOOS=$goos GOARCH=$goarch CC="zig cc -target $zigtarget" \
              go build -buildmode=c-shared -trimpath -ldflags "-s -w" -o "$stage/$PLUGIN_ID.$ext" .
            (cd "$stage" && zip -q "../../dist/${PLUGIN_ID}_${version}_${goos}_${goarch}.zip" "$PLUGIN_ID.$ext")
          done
      - uses: actions/upload-artifact@v4
        with:
          name: windows-linux
          path: dist/*.zip

  darwin:
    needs: validation
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for goarch in amd64 arm64; do
            arch=$([ "$goarch" = amd64 ] && echo x86_64 || echo arm64)
            stage="stage/darwin-$goarch"
            mkdir -p "$stage"
            CGO_ENABLED=1 GOOS=darwin GOARCH=$goarch CC="clang -arch $arch" \
              go build -buildmode=c-shared -trimpath -ldflags "-s -w" -o "$stage/$PLUGIN_ID.dylib" .
            (cd "$stage" && zip -q "../../dist/${PLUGIN_ID}_${version}_darwin_${goarch}.zip" "$PLUGIN_ID.dylib")
          done
      - uses: actions/upload-artifact@v4
        with:
          name: darwin
          path: dist/*.zip

  release:
    needs: [windows-linux, darwin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.zip > checksums.txt
          gh release create "$GITHUB_REF_NAME" *.zip checksums.txt \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
