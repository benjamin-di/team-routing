name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Go and ABI regression tests
        run: go test -tags abiprobe -count=1 ./...
      - name: Dashboard syntax
        run: |
          node --check dashboard.js
          node --check editors.js
          node --test dashboard_session_test.js
